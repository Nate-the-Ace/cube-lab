<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Draft odds, combos and synergies for one cube.">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Cube Lab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ground:#f4f2ec; --surface:#fffefb; --raised:#eeebe2;
  --ink:#1b1f1c; --dim:#5d655e; --faint:#8c948c; --line:#dcd8cd;
  --brass:#8a6a17; --brass-soft:#b99a45;
  --good:#2f6b44; --warn:#95651a; --bad:#9c3330;
  --W:#efe4b8; --U:#2a6fa8; --B:#3a332c; --R:#b83c33; --G:#2e6b46; --C:#a8a49b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1211; --surface:#161c19; --raised:#1e2521;
  --ink:#e9e7df; --dim:#9aa29a; --faint:#6d756e; --line:#2b332e;
  --brass:#cfa94e; --brass-soft:#8f7634;
  --good:#6fae7c; --warn:#d9a052; --bad:#d8746e;
  --W:#e8dfbb; --U:#5a9ed0; --B:#5d5348; --R:#d4635a; --G:#5aa06f; --C:#9d9a92;
}}
:root[data-theme="dark"]{
  --ground:#0e1211; --surface:#161c19; --raised:#1e2521;
  --ink:#e9e7df; --dim:#9aa29a; --faint:#6d756e; --line:#2b332e;
  --brass:#cfa94e; --brass-soft:#8f7634;
  --good:#6fae7c; --warn:#d9a052; --bad:#d8746e;
  --W:#e8dfbb; --U:#5a9ed0; --B:#5d5348; --R:#d4635a; --G:#5aa06f; --C:#9d9a92;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

header.top{border-bottom:1px solid var(--line);background:var(--surface);
  padding-block:22px 18px;margin-bottom:22px}
header.top .wrap{padding-block:0}
h1{font-family:var(--display);font-size:30px;font-weight:600;margin:0;
  letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--brass)}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.sub b{color:var(--ink);font-weight:600}
.topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.topbar .spacer{flex:1}
button,select,input{font:inherit;color:var(--ink);background:var(--raised);
  border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer}
button:hover{border-color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.controls{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:18px}
.ctlrow{display:flex;gap:18px;flex-wrap:wrap;align-items:end}
label.field{display:flex;flex-direction:column;gap:3px;font-size:11px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
label.field input[type=number]{width:74px;font-family:var(--mono)}
input[type=range]{accent-color:var(--brass);background:none;border:0;padding:0;width:180px}
.ends{display:flex;justify-content:space-between;font-size:10px;color:var(--faint)}
.shape{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.6}
.shape b{color:var(--ink);font-family:var(--mono)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--mono);font-size:24px;color:var(--brass);line-height:1.15}
.tile span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--dim);margin-top:3px}

section.block{border-top:1px solid var(--line)}
section.block>details>summary{cursor:pointer;list-style:none;display:flex;
  align-items:baseline;gap:9px;padding-block:14px}
section.block>details>summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--brass);font-size:11px;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
summary:hover h2{color:var(--brass)}
.count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.note{color:var(--dim);font-size:13px;margin:0 0 12px;max-width:74ch}
.note b{color:var(--ink)}
.body{padding-bottom:20px}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);
  white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--surface)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.nm{font-weight:600}
.dim{color:var(--dim)}
.mini{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;
  border:1px solid var(--line);color:var(--dim);font-family:var(--mono);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}

.disc{display:inline-flex;vertical-align:-3px;margin-right:5px}
.manaset{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

details.cards{display:inline-block}
details.cards>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px}
details.cards>summary::-webkit-details-marker{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 14px;
  margin:8px 0 4px;padding:9px;background:var(--raised);border:1px solid var(--line);
  border-radius:9px;font-weight:400}
.chip{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:1px 0}
.chip span{color:var(--faint);font-family:var(--mono);font-size:11px}

.bar{display:inline-block;height:8px;border-radius:2px;background:var(--brass-soft);
  vertical-align:middle}

.fb{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-top:30px}
.fb h2{margin-bottom:4px}
.fb textarea{width:100%;min-height:78px;font:inherit;background:var(--raised);
  color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.fb .row{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
.fb .primary{background:var(--brass);border-color:var(--brass);color:var(--ground);font-weight:600}
.fbitem{border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-size:13.5px}
.fbitem .when{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){h1{font-size:24px}.tile b{font-size:20px}}
</style>
</head>
<body>

<header class="top"><div class="wrap"><div class="topbar">
  <div>
    <h1>Cube <em>Lab</em></h1>
    <div class="sub" id="ident">loading…</div>
  </div>
  <span class="spacer"></span>
  <button id="theme" title="Switch theme">◐</button>
</div></div></header>

<div class="wrap">
  <div class="controls">
    <div class="ctlrow">
      <label class="field">Players<input id="players" type="number" min="2" max="12" value="8"></label>
      <label class="field">Pack size<input id="pack" type="number" min="5" max="30" value="15"></label>
      <label class="field">Packs each<input id="rounds" type="number" min="1" max="6" value="3"></label>
      <label class="field">How contested <span class="mini" id="contlabel">normal</span>
        <input id="cont" type="range" min="0" max="0.9" step="0.05" value="0.35">
        <span class="ends"><span>nobody wants it</span><span>first pick for all</span></span>
      </label>
    </div>
    <div class="shape" id="shape"></div>
  </div>

  <div class="tiles" id="tiles"></div>
  <div id="sections"></div>

  <div class="fb">
    <h2>Tell Nathan what's wrong with it</h2>
    <p class="note" id="fbnote">Anything that looks wrong, anything missing, anything you'd actually use.</p>
    <textarea id="fbtext" placeholder="e.g. the Izzet numbers look off — we drafted it twice last year"></textarea>
    <div class="row">
      <button class="primary" id="fbsend">Send feedback</button>
      <span class="mini" id="fbstatus"></span>
    </div>
    <div id="fblist"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="cubedata" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('cubedata').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => v == null ? '—' : '$' + Number(v).toFixed(2);
const pct = v => v == null ? '—' : (v * 100).toFixed(v < 0.01 ? 2 : 1) + '%';

/* theme ------------------------------------------------------------------ */
$('#theme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme
    ? r.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('cubelab-theme', r.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('cubelab-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* colour ----------------------------------------------------------------- */
const NAMES = {'':'Colorless','C':'Colorless','W':'White','U':'Blue','B':'Black','R':'Red','G':'Green',
  'UW':'Azorius','BU':'Dimir','BR':'Rakdos','GR':'Gruul','GW':'Selesnya','BW':'Orzhov','RU':'Izzet',
  'BG':'Golgari','RW':'Boros','GU':'Simic','BUW':'Esper','BRU':'Grixis','BGR':'Jund','GRW':'Naya',
  'GUW':'Bant','BGW':'Abzan','RUW':'Jeskai','BGU':'Sultai','BRW':'Mardu','GRU':'Temur',
  'BRUW':'Yore-Tiller','BGRU':'Glint-Eye','BGRW':'Dune-Brood','GRUW':'Ink-Treader',
  'BGUW':'Witch-Maw','BGRUW':'Five-Color'};
const FILL = {W:'var(--W)',U:'var(--U)',B:'var(--B)',R:'var(--R)',G:'var(--G)',C:'var(--C)'};
const letters = ci => [...(ci || '').toUpperCase()].filter(c => 'WUBRG'.includes(c));
const ciName = ci => { const L = letters(ci); return L.length ? NAMES[L.slice().sort().join('')] : 'Colorless'; };

/* One disc cut into equal wedges — the combination reads at a glance. */
function disc(ci, size) {
  const L = letters(ci), list = L.length ? L : ['C'], s = size || 17, r = s / 2, c = r;
  const body = list.length === 1
    ? `<circle cx="${c}" cy="${c}" r="${r - .5}" fill="${FILL[list[0]]}"/>`
    : list.map((col, i) => {
        const a0 = (-90 + 360 / list.length * i) * Math.PI / 180;
        const a1 = (-90 + 360 / list.length * (i + 1)) * Math.PI / 180;
        const big = 360 / list.length > 180 ? 1 : 0;
        return `<path d="M${c},${c} L${(c + (r - .5) * Math.cos(a0)).toFixed(2)},${(c + (r - .5) * Math.sin(a0)).toFixed(2)} `
          + `A${r - .5},${r - .5} 0 ${big},1 ${(c + (r - .5) * Math.cos(a1)).toFixed(2)},${(c + (r - .5) * Math.sin(a1)).toFixed(2)} Z" fill="${FILL[col]}"/>`;
      }).join('');
  return `<span class="disc" title="${esc(ciName(ci))}"><svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-label="${esc(ciName(ci))}">`
    + `${body}<circle cx="${c}" cy="${c}" r="${r - .5}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1"/></svg></span>`;
}
const manaLabel = ci => `<span class="manaset">${disc(ci)}<span class="dim">${esc(ciName(ci))}</span></span>`;

/* draft maths ------------------------------------------------------------
   Re-implemented here so the sliders keep working with no server. Two things
   have to happen for a card to reach you: it has to be opened at all, and it
   has to survive the drafters sitting between its pack's opener and your seat. */
function settings() {
  return {
    players: Math.max(2, +$('#players').value || 8),
    pack: Math.max(2, +$('#pack').value || 15),
    rounds: Math.max(1, +$('#rounds').value || 3),
    cont: Math.min(0.95, Math.max(0, +$('#cont').value)),
    size: D.cube.cards,
  };
}
function odds(s) {
  const used = s.players * s.rounds * s.pack;
  const opened = Math.min(1, used / s.size);
  let total = 0;
  for (let d = 0; d < s.players; d++) {
    let survive = 1;
    for (let j = 0; j < d; j++) {
      const left = Math.max(1, s.pack - j);
      survive *= Math.max(0, 1 - (s.cont + (1 - s.cont) / left));
    }
    total += survive;
  }
  const reaches = total / s.players;
  return {used, opened, reaches, each: opened * reaches, picks: s.rounds * s.pack};
}
/* chance of drawing at least k of n, given the per-card odds */
function atLeast(n, k, p) {
  if (n <= 0) return 0;
  const ln = x => { let t = 0; for (let i = 2; i <= x; i++) t += Math.log(i); return t; };
  let tot = 0;
  for (let i = k; i <= n; i++) {
    tot += Math.exp(ln(n) - ln(i) - ln(n - i) + i * Math.log(p || 1e-9) + (n - i) * Math.log(1 - p || 1e-9));
  }
  return Math.min(1, tot);
}

/* sections --------------------------------------------------------------- */
function section(id, title, count, note, bodyHtml, open) {
  return `<section class="block"><details data-sec="${id}"${open ? ' open' : ''}>
    <summary><h2>${esc(title)}</h2>${count != null ? `<span class="count">${count}</span>` : ''}</summary>
    <div class="body">${note ? `<p class="note">${note}</p>` : ''}${bodyHtml}</div>
  </details></section>`;
}
const cardGrid = (items, right) => `<div class="grid">${items.map(c =>
  `<span class="chip">${esc(c.name || c.card_name)}<span>${right(c)}</span></span>`).join('')}</div>`;

function render() {
  const s = settings(), o = odds(s);
  $('#contlabel').textContent = s.cont < .15 ? 'uncontested' : s.cont < .3 ? 'mild'
    : s.cont < .5 ? 'normal' : s.cont < .7 ? 'contested' : 'everyone wants it';
  $('#ident').innerHTML = `<b>${esc(D.cube.name)}</b> · ${D.cube.cards} cards · list read ${esc((D.cube.refreshed || '').slice(0, 10))}`;
  $('#shape').innerHTML = `A ${s.players}-player draft with ${s.rounds}×${s.pack} packs uses
    <b>${o.used}</b> of the cube's ${s.size} cards and gives you <b>${o.picks}</b> picks.
    Any one card you want has a <b>${pct(o.opened)}</b> chance of being opened and, once opened,
    a <b>${pct(o.reaches)}</b> chance of reaching your seat before someone takes it —
    <b>${pct(o.each)}</b> overall.${o.used > s.size
      ? ' <span class="pill bad">more cards needed than the cube holds</span>' : ''}`;

  $('#tiles').innerHTML = [
    [D.combos.self_contained, 'combos you could assemble'],
    [D.near.cards.length, 'cards one short of a combo'],
    [pct(o.each), 'odds on any one card'],
    [D.pairs_total.toLocaleString(), 'pairs above chance'],
    [D.tactics.length, 'tactics supported'],
  ].map(([b, l]) => `<div class="tile"><b>${b}</b><span>${esc(l)}</span></div>`).join('');

  const out = [];

  /* opportunity */
  out.push(section('opp', 'Where the opportunity is', D.opportunity.length,
    `<b>Depth</b> is a hard fact about the list. <b>Power</b> is the average EDHREC play rate of the
     lane's twenty best spells — a proxy, and a loose one: that data is multiplayer Commander, so it
     says "these cards are strong" far better than "this strategy is strong".`,
    `<div class="scroll"><table><thead><tr><th>Lane</th><th class="num">Spells</th>
      <th class="num">Power</th><th class="num">Expect to draft</th><th class="num">Opportunity</th>
      </tr></thead><tbody>${D.opportunity.map(l => `<tr>
        <td class="nm">${manaLabel(l.colors)}</td>
        <td class="num">${l.spells}</td>
        <td class="num">${(l.top20_power / 1000).toFixed(0)}k</td>
        <td class="num">${(l.cards_in_cube * o.each).toFixed(1)}</td>
        <td class="num">${l.opportunity.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`,
    true));

  /* lanes */
  out.push(section('lanes', 'Colour lanes', D.lanes.length,
    `How cube drafting actually works: pick a pair and see how deep it runs.
     “Expect” is how many of that lane's cards should reach you across the whole draft.`,
    `<div class="scroll"><table><thead><tr><th>Lane</th><th class="num">Cards</th>
      <th class="num">Mono</th><th class="num">Gold</th><th class="num">Expect to draft</th>
      </tr></thead><tbody>${D.lanes.map(l => `<tr>
        <td class="nm">${manaLabel(l.colors)}</td><td class="num">${l.cards_in_cube}</td>
        <td class="num">${l.mono}</td><td class="num">${l.gold}</td>
        <td class="num">${(l.cards_in_cube * o.each).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`));

  /* pairs */
  out.push(section('pairs', 'Pairs worth trying', D.pairs.length,
    `Card pairs that real decks play together far more often than their individual popularity
     predicts. <b>Lift</b> is how many times more often than chance — 1 is coincidence, 40 means
     decks that play one go and find the other. The mana base is excluded: duals share decks with
     everything in their colours, which is a fact about fixing, not an idea.`,
    `<div class="scroll"><table><thead><tr><th>Pair</th><th>Type</th><th class="num">Lift</th>
      <th class="num">Decks together</th><th class="num">$</th><th>Why it might work</th>
      </tr></thead><tbody>${D.pairs.slice(0, 60).map(p => `<tr>
        <td class="nm">${p.cards.map(c => esc(c.name)).join(' <span class="dim">+</span> ')}
          <div class="mini">${disc(p.colors, 13)} ${p.cards.map(c => esc((c.type_line || '').split(' —')[0])).join(' · ')}</div></td>
        <td><span class="pill">${esc(p.kind)}</span></td>
        <td class="num">${p.lift}×</td>
        <td class="num">${p.played_together.toLocaleString()}</td>
        <td class="num">${money(p.total_price)}</td>
        <td class="dim">${p.hint ? esc(p.hint) : '—'}</td></tr>`).join('')}</tbody></table></div>`));

  /* tactics */
  out.push(section('tactics', 'Tactics this cube supports', D.tactics.length,
    `Ranked by depth weighted by how strongly those cards belong to the strategy.
     <b>Read this list with suspicion:</b> the theme data is Commander-shaped, so it happily reports
     set mechanics (morph, kicker, foretell) as though they were archetypes. Open a row to see the
     cards and judge for yourself — if they're all duals, the match is spurious.`,
    `<div class="scroll"><table><thead><tr><th>Tactic</th><th class="num">Cards</th>
      <th class="num">Expect to draft</th><th class="num">Support</th><th class="num">P(6+)</th>
      </tr></thead><tbody>${D.tactics.map(t => `<tr>
        <td class="nm"><details class="cards"><summary>${esc(t.name)}</summary>
          ${cardGrid(t.examples, c => (c.synergy >= 0 ? '+' : '') + (c.synergy || 0).toFixed(2))}
        </details></td>
        <td class="num">${t.cards_in_cube}</td>
        <td class="num">${(t.cards_in_cube * o.each).toFixed(1)}</td>
        <td class="num">${t.support}</td>
        <td class="num">${pct(atLeast(t.cards_in_cube, 6, o.each))}</td></tr>`).join('')}</tbody></table></div>`));

  /* balance */
  const curve = D.balance.curve, cmax = Math.max(...Object.values(curve));
  const spells = Object.values(curve).reduce((a, b) => a + b, 0);
  out.push(section('balance', 'Balance', null,
    `Counts only, no judgement attached — judging a cube card needs a measure of cube power this
     page doesn't have.`,
    `<div class="tiles">${Object.entries(D.balance.by_colour).map(([k, v]) =>
      `<div class="tile"><b>${v}</b><span>${k === 'multicolour' ? 'multicolour'
        : k === 'C' ? 'colourless' : esc(ciName(k))}</span></div>`).join('')}</div>
     <div class="scroll"><table><thead><tr><th>Mana value</th><th class="num">Cards</th>
       <th>Share of spells</th></tr></thead><tbody>${Object.entries(curve).map(([mv, n]) => `<tr>
       <td class="nm">${mv === '7' ? '7+' : esc(mv)}</td><td class="num">${n}</td>
       <td><span class="bar" style="width:${Math.round(240 * n / cmax)}px"></span>
         <span class="mini"> ${(100 * n / spells).toFixed(0)}%</span></td></tr>`).join('')}
     </tbody></table></div>
     <div class="scroll"><table style="margin-top:10px"><thead><tr><th>Card type</th>
       <th class="num">Cards</th></tr></thead><tbody>${Object.entries(D.balance.by_type).map(([k, v]) =>
       `<tr><td class="nm">${esc(k)}</td><td class="num">${v}</td></tr>`).join('')}</tbody></table></div>`));

  /* composition */
  out.push(section('made', 'What the cube is made of', D.functions.length,
    `Measured from card text and Scryfall's function tags — format-neutral, unlike the theme data
     above. Open a row for the cards.`,
    `<div class="scroll"><table><thead><tr><th>Does this</th><th class="num">Cards</th>
      <th>Source</th></tr></thead><tbody>${D.functions.map(f => `<tr>
        <td class="nm"><details class="cards"><summary>${esc(f.label)}</summary>
          ${cardGrid(f.examples, c => esc((c.type_line || '').split(' —')[0]))}
        </details><div class="mini">${esc(f.blurb || '')}</div></td>
        <td class="num">${f.n}</td>
        <td class="dim">${f.kind === 'tag' ? 'Scryfall tag' : 'text parser'}</td></tr>`).join('')}</tbody></table></div>`));

  /* combos */
  const cRows = D.combos.known.map(c => {
    const needs = c.self_contained
      ? '<span class="pill good">nothing else</span>'
      : `<span class="pill bad">needs ${c.n_extra} more</span>`
        + (c.prereqs || []).map(p => `<div class="mini">• ${esc(p)}</div>`).join('')
        + (c.templates || []).map(t => t.checkable
            ? `<div class="mini">• a ${esc(t.template)} — ${t.found
                ? `<span class="pill good">cube has ${t.found}</span>` : '<span class="pill bad">none in your cube</span>'}</div>`
            : `<div class="mini">• a ${esc(t.template)} <span class="dim">(can't check automatically)</span></div>`).join('');
    const p = Math.pow(o.each, c.n_cards);
    return `<tr><td class="nm">${c.cards.map(esc).join(' <span class="dim">+</span> ')}</td>
      <td class="num">${c.n_cards}</td><td class="num">${pct(p)}</td>
      <td class="num">${p > 0 ? (1 / p).toFixed(1) : '—'}</td>
      <td class="dim">${esc((c.produces || []).join(', '))}</td><td>${needs}</td></tr>`;
  }).join('');
  out.push(section('combos', 'Known combos touching this cube', D.combos.known.length,
    `<b>Naming two cards is not the same as needing only two cards</b> — nearly half of all known
     combos also require something unnamed, like "a way to give it lifelink". Those are listed under
     <b>Also needs</b>. ${D.combos.self_contained} of ${D.combos.known.length} need nothing beyond
     the cards named, so "drafts to hit" is optimistic for the rest.`,
    `<div class="scroll"><table><thead><tr><th>Combo</th><th class="num">Pieces</th>
      <th class="num">Odds</th><th class="num">Drafts to hit</th><th>Produces</th><th>Also needs</th>
      </tr></thead><tbody>${cRows}</tbody></table></div>`));

  /* one card short */
  out.push(section('near', 'One card short', D.near.cards.length,
    `No combo of three or more cards sits entirely inside this cube — that's the honest answer to
     searching for them. The useful answer is next door: each of these would <em>complete</em> a
     combo whose every other piece is already here. Restricted to ${esc(D.near.format)}-legal cards
     (${D.near.excluded_illegal} were dropped for that reason, including
     ${(D.near.illegal_examples || []).map(esc).join(', ')}).`,
    `<div class="scroll"><table><thead><tr><th>Add this</th><th>Type</th><th class="num">$</th>
      <th class="num">Completes</th><th>What it finishes</th></tr></thead><tbody>
      ${D.near.cards.map(c => `<tr>
        <td class="nm">${esc(c.name)}</td>
        <td class="dim">${disc(c.color_identity, 13)} ${esc((c.type_line || '').split(' —')[0])}</td>
        <td class="num">${money(c.price_usd)}</td>
        <td class="num">${c.unlocks}</td>
        <td class="dim">${c.combos.map(k => `<div class="mini">${k.n_cards}-card:
          ${k.cards.map(esc).join(' + ')} → ${esc((k.produces || []).slice(0, 2).join(', '))}</div>`).join('')}</td>
      </tr>`).join('')}</tbody></table></div>`));

  /* keep whichever sections were open across a re-render */
  let openSecs;
  try { openSecs = JSON.parse(localStorage.getItem('cubelab-open') || 'null'); } catch (e) {}
  $('#sections').innerHTML = out.join('');
  document.querySelectorAll('#sections details[data-sec]').forEach(d => {
    if (openSecs) d.open = openSecs.includes(d.dataset.sec);
    d.addEventListener('toggle', () => {
      const keys = [...document.querySelectorAll('#sections details[data-sec]')]
        .filter(x => x.open).map(x => x.dataset.sec);
      try { localStorage.setItem('cubelab-open', JSON.stringify(keys)); } catch (e) {}
    });
  });

  $('#foot').innerHTML = `Built from ${Number(D.built_from.cards).toLocaleString()} cards,
    ${Number(D.built_from.combos).toLocaleString()} known combos and
    ${Number(D.built_from.commanders).toLocaleString()} EDHREC commanders.
    Prices ${esc(D.built_from.prices)}. This is a frozen snapshot of the cube list —
    re-export it from the tool when the cube changes.`;
}

['#players', '#pack', '#rounds', '#cont'].forEach(sel =>
  $(sel).addEventListener('input', render));
render();

/* feedback --------------------------------------------------------------- */
(async () => {
  const db = await window.claude?.use?.('db');
  const status = $('#fbstatus'), list = $('#fblist');
  if (!db) {
    $('#fbsend').disabled = true;
    $('#fbtext').disabled = true;
    $('#fbnote').innerHTML = `This copy can't collect feedback — it's a plain file with nothing
      behind it. Send Nathan a message, or open an issue on the repo.`;
    return;
  }
  const notes = db.collection('feedback');
  const draw = docs => {
    list.innerHTML = docs.length
      ? `<div class="mini" style="margin-top:14px">${docs.length} note${docs.length === 1 ? '' : 's'} so far</div>`
        + docs.map(d => `<div class="fbitem"><div class="when">${esc((d.at || '').slice(0, 16).replace('T', ' '))}</div>${esc(d.text)}</div>`).join('')
      : '';
  };
  try {
    notes.orderBy('at', 'desc').limit(30).onSnapshot(
      snap => draw(snap.docs.map(d => d.data())), () => {});
  } catch (e) {}
  $('#fbsend').onclick = async () => {
    const text = $('#fbtext').value.trim();
    if (!text) return;
    $('#fbsend').disabled = true;
    status.textContent = 'sending…';
    try {
      await notes.doc(String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8))
        .set({text, at: new Date().toISOString()});
      $('#fbtext').value = '';
      status.textContent = 'sent — thank you';
    } catch (e) {
      status.textContent = "couldn't send that — you may not have edit access to this page";
    }
    $('#fbsend').disabled = false;
  };
})();
</script>
</body>
</html>
